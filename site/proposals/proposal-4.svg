<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Concept 4: before / after — the old way vs swarmexec -->
  <rect width="1100" height="560" fill="#0d1117"/>

  <text x="550" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-1">swarmexec<tspan fill="#39c5cf">_</tspan></text>
  <text x="550" y="86" text-anchor="middle" font-size="16" fill="#8b949e">stop hunting for the node</text>

  <!-- BEFORE panel -->
  <rect x="60" y="130" width="460" height="360" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="90" y="170" font-size="16" fill="#f85149" font-weight="700">THE OLD WAY</text>
  <line x1="90" y1="184" x2="490" y2="184" stroke="#30363d" stroke-width="1.5"/>
  <g font-size="17" xml:space="preserve">
    <text x="90" y="224"><tspan fill="#484f58">$ </tspan><tspan fill="#8b949e">docker node ls</tspan></text>
    <text x="90" y="258"><tspan fill="#484f58">$ </tspan><tspan fill="#8b949e">docker service ps web</tspan></text>
    <text x="90" y="292"><tspan fill="#484f58"># which node runs the task?</tspan></text>
    <text x="90" y="326"><tspan fill="#484f58">$ </tspan><tspan fill="#8b949e">ssh node-3</tspan></text>
    <text x="90" y="360"><tspan fill="#484f58">$ </tspan><tspan fill="#8b949e">docker ps | grep web</tspan></text>
    <text x="90" y="394"><tspan fill="#484f58">$ </tspan><tspan fill="#8b949e">docker exec -it a1b2 sh</tspan></text>
  </g>
  <text x="90" y="450" font-size="15" fill="#f85149">6 steps · SSH to every node · error-prone</text>

  <!-- arrow -->
  <g transform="translate(550,310)">
    <path d="M-18 0 L18 0 M6 -12 L18 0 L6 12" fill="none" stroke="#2f81f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AFTER panel -->
  <rect x="580" y="130" width="460" height="360" rx="14" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="610" y="170" font-size="16" fill="#39c5cf" font-weight="700">WITH SWARMEXEC</text>
  <line x1="610" y1="184" x2="1010" y2="184" stroke="#30363d" stroke-width="1.5"/>
  <g font-size="20" xml:space="preserve">
    <text x="610" y="270"><tspan fill="#39c5cf">$ </tspan><tspan fill="#8b949e">swarmexec exec </tspan><tspan fill="#e6edf3">web</tspan><tspan fill="#8b949e"> -- sh</tspan></text>
  </g>
  <rect x="610" y="290" width="14" height="26" fill="#39c5cf">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="610" y="360" font-size="15" fill="#484f58"># routed to the right node automatically</text>
  <text x="610" y="450" font-size="15" fill="#39c5cf">1 command · any node · from one terminal</text>
</svg>
