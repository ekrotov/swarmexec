<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Concept 8: isometric node cube you exec into -->
  <rect x="1" y="1" width="148" height="148" rx="34" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g transform="translate(75,42)">
    <!-- right and left faces -->
    <path d="M-40,20 L0,40 L0,80 L-40,60 Z" fill="#1c7178"/>
    <path d="M0,40 L40,20 L40,60 L0,80 Z" fill="#279aa1"/>
    <!-- top face -->
    <path d="M0,0 L40,20 L0,40 L-40,20 Z" fill="#39c5cf"/>
    <!-- prompt >_ on top face -->
    <path d="M-14,13 L-2,20 L-14,27" fill="none" stroke="#0d1117" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1" y="24" width="14" height="4.5" rx="2" fill="#0d1117"/>
  </g>
</svg>
