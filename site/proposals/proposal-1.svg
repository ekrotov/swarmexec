<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Concept 1: Terminal-prompt logo mark -->
  <rect width="800" height="500" fill="#0d1117"/>

  <!-- terminal window -->
  <rect x="120" y="90" width="560" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- title bar -->
  <line x1="120" y1="138" x2="680" y2="138" stroke="#30363d" stroke-width="2"/>
  <circle cx="152" cy="114" r="7" fill="#f85149"/>
  <circle cx="176" cy="114" r="7" fill="#39c5cf"/>
  <circle cx="200" cy="114" r="7" fill="#2f81f7"/>
  <text x="400" y="119" fill="#484f58" font-size="14" text-anchor="middle">swarmexec — any node</text>

  <!-- prompt line -->
  <text x="160" y="212" font-size="22" xml:space="preserve"><tspan fill="#39c5cf">$ </tspan><tspan fill="#8b949e">swarmexec exec </tspan><tspan fill="#e6edf3">web</tspan><tspan fill="#8b949e"> -- sh</tspan></text>
  <text x="160" y="248" fill="#484f58" font-size="15"># interactive shell, cluster-wide</text>

  <!-- big wordmark with blinking cursor underscore -->
  <text x="160" y="340" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-2">swarmexec<tspan fill="#39c5cf">_<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
