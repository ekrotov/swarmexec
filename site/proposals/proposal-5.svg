<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Concept 5: abstract secure network / routing hero -->
  <rect width="1000" height="620" fill="#0d1117"/>

  <!-- radiating links from hub (500,300) to nodes -->
  <g fill="none" stroke="#30363d" stroke-width="2">
    <line x1="500" y1="300" x2="180" y2="150"/>
    <line x1="500" y1="300" x2="180" y2="300"/>
    <line x1="500" y1="300" x2="200" y2="470"/>
    <line x1="500" y1="300" x2="500" y2="110"/>
    <line x1="500" y1="300" x2="500" y2="500"/>
    <line x1="500" y1="300" x2="820" y2="150"/>
    <line x1="500" y1="300" x2="800" y2="470"/>
  </g>
  <!-- active secure link to target (right) -->
  <line x1="500" y1="300" x2="820" y2="300" stroke="#39c5cf" stroke-width="3" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- worker nodes -->
  <g>
    <circle cx="180" cy="150" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="180" cy="300" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="200" cy="470" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="500" cy="110" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="500" cy="500" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="820" cy="150" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="800" cy="470" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- target node (accent) with terminal glyph -->
  <circle cx="820" cy="300" r="34" fill="#161b22" stroke="#2f81f7" stroke-width="3"/>
  <path d="M808 292 L818 300 L808 308" fill="none" stroke="#39c5cf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="822" y="304" width="12" height="3.5" rx="1.5" fill="#2f81f7"/>

  <!-- central manager hub -->
  <circle cx="500" cy="300" r="60" fill="none" stroke="#39c5cf" stroke-width="1.5" opacity="0.35">
    <animate attributeName="r" values="52;72" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="300" r="46" fill="#161b22" stroke="#39c5cf" stroke-width="3"/>
  <!-- lock glyph = mTLS -->
  <path d="M488 298 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#39c5cf" stroke-width="3"/>
  <rect x="484" y="298" width="32" height="24" rx="4" fill="#39c5cf"/>
  <circle cx="500" cy="308" r="3.5" fill="#0d1117"/>
  <rect x="498.5" y="308" width="3" height="8" fill="#0d1117"/>

  <!-- wordmark + tagline -->
  <text x="500" y="588" text-anchor="middle" font-size="40" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">swarmexec<tspan fill="#39c5cf">_<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text x="820" y="360" text-anchor="middle" font-size="14" fill="#8b949e">mTLS · any node</text>
</svg>
