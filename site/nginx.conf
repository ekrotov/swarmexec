server {
    # Non-root nginx (nginx-unprivileged) binds an unprivileged port; Traefik
    # forwards to 8080. TLS is terminated by Traefik.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by Traefik; this server only speaks plain HTTP.
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Security headers (static site, no inline JS beyond what we ship).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health endpoint for the container HEALTHCHECK and Swarm.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Docs page, also reachable without the .html suffix.
    location = /docs {
        try_files /docs.html =404;
    }

    # Privacy page, also reachable without the .html suffix.
    location = /datenschutz {
        try_files /datenschutz.html =404;
    }

    # Release-notes page, also reachable without the .html suffix.
    location = /releases {
        try_files /releases.html =404;
    }

    # Images get an explicit lifetime. Without one they carry only ETag and
    # Last-Modified, and the browser falls back to heuristic freshness — which
    # is both unpredictable and, for a file whose Last-Modified is months old,
    # potentially far longer than anything set here. The landing page's carousel
    # rewinds each gif when its slide comes round again, so this is the
    # difference between a cache hit and a conditional request every cycle; the
    # demo gifs are ~400 KB each.
    #
    # One day, not a year: these paths are stable across releases (no content
    # hash in the filename), so the cache lifetime IS the staleness window after
    # a gif is regenerated. A day bounds that; heuristic caching does not.
    #
    # NOTE: no add_header here, on purpose. nginx does not inherit the
    # server-level add_header directives into a location that declares one of
    # its own — adding "Cache-Control" this way would silently drop
    # X-Content-Type-Options, X-Frame-Options and Referrer-Policy from every
    # image response. `expires` sets Cache-Control without add_header, so the
    # security headers above still apply.
    location ~* \.(?:gif|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
