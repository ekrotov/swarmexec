# swarmexec landing page — served at https://swarm-exec.cloud-surfers.net
#
# Deploy (on a manager, with the image built & pushed by CI):
#   docker stack deploy -c site/deploy/site-stack.yml swarmexec-site
#
# Routing/TLS is handled by the shared Traefik on the external `gateway`
# network (letsencrypt cert resolver), matching the rest of the logle.io infra.
#
# Hardening: runs NON-ROOT (nginx-unprivileged, uid 101, serves on 8080), with a
# read-only root filesystem (a small tmpfs holds nginx's pid + temp files) and
# all Linux capabilities dropped. A static file server needs none of them.

services:
  site:
    image: ${SWARMEXEC_SITE_IMAGE:-registry.logle.io/cs-public/swarm-remote-exec/site:latest}
    user: "101:101"          # nginx (non-root)
    read_only: true          # immutable root filesystem
    cap_drop:
      - ALL
    tmpfs:
      - /tmp                  # nginx pid + client/proxy/fastcgi temp live here
    networks:
      - gateway
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M
      labels:
        # Traefik v3 (shared gateway network, letsencrypt TLS). Non-root nginx
        # serves on 8080.
        - "traefik.enable=true"
        - "traefik.http.routers.swarmexec-site.entrypoints=https"
        - "traefik.http.routers.swarmexec-site.rule=Host(`swarm-exec.cloud-surfers.net`)"
        - "traefik.http.routers.swarmexec-site.tls=true"
        - "traefik.http.routers.swarmexec-site.tls.certresolver=letsencrypt"
        - "traefik.http.services.swarmexec-site.loadbalancer.server.port=8080"
        # Redirect plain HTTP to HTTPS.
        - "traefik.http.routers.swarmexec-site-http.entrypoints=http"
        - "traefik.http.routers.swarmexec-site-http.rule=Host(`swarm-exec.cloud-surfers.net`)"
        - "traefik.http.routers.swarmexec-site-http.middlewares=swarmexec-site-redirect"
        - "traefik.http.middlewares.swarmexec-site-redirect.redirectscheme.scheme=https"

networks:
  gateway:
    external: true
