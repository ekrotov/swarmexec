# swarmexec CI / CD
#
# Stages:
#   .pre    — verify-tag-on-main: gate that a release tag actually sits on main
#   test    — go vet, gofmt check, race tests, generated-code check, code navigation
#   build   — cross-compile the cli (linux / macOS / windows) -> artifacts
#   image   — build the agent image and push it to the GitLab Container Registry
#   release — publish a GitLab Release for the tag
#
# Versioning:
#   * Branch / MR pipelines  -> dev builds stamped with the short commit SHA.
#   * A SEMANTIC-VERSION git tag (e.g. v1.2.3) builds a release stamped with that
#     version — but ONLY if the tagged commit is on the default branch (main).
#     The verify-tag-on-main gate in `.pre` fails otherwise, which stops every
#     later stage, so no release is produced for a tag that is not on main.

stages:
  - test
  - build
  - image
  - release
  - deploy

variables:
  GO_IMAGE: "golang:1.27"
  GOPATH: "$CI_PROJECT_DIR/.gocache"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# A semantic-version tag: vMAJOR.MINOR.PATCH with an optional -prerelease
# (the leading "v" is optional). Anchored so it can be reused in several jobs.
# SemVer "+build" metadata is intentionally excluded: "+" is not a valid Docker
# image-tag character, so such tags could not be published as an image.
.semver-tag: &semver-tag
  if: '$CI_COMMIT_TAG =~ /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$/'

# Reusable Go module cache (keyed on go.sum).
.go-cache: &go-cache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gocache/pkg/mod

# ----------------------------------------------------------------------------
# .pre — release gate: a semver tag must point at a commit that is on main
# ----------------------------------------------------------------------------
verify-tag-on-main:
  stage: .pre
  image: $GO_IMAGE
  variables:
    GIT_DEPTH: "0" # full history so merge-base can see both the tag and main
  script:
    - git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" "refs/remotes/origin/${CI_DEFAULT_BRANCH}"; then
        echo "OK: tag $CI_COMMIT_TAG ($CI_COMMIT_SHORT_SHA) is on $CI_DEFAULT_BRANCH — release allowed"
      else
        echo "REJECT: tag $CI_COMMIT_TAG ($CI_COMMIT_SHORT_SHA) is NOT on $CI_DEFAULT_BRANCH."
        echo "Releases are only built from tags on the default branch. Aborting."
        exit 1
      fi
  rules:
    - *semver-tag

# ----------------------------------------------------------------------------
# test
# ----------------------------------------------------------------------------
test:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - go vet ./...
    - |
      if [ -n "$(gofmt -l agent client internal site tools)" ]; then
        echo "gofmt: the following files need formatting:"
        gofmt -l agent client internal site tools
        exit 1
      fi
    - go test -race ./...

# ----------------------------------------------------------------------------
# generate-check — the checked-in internal/pb must be exactly what
# proto/swarmexec.proto generates. Nothing else ties the two together: the
# build compiles whatever internal/pb holds, so a .proto edit without a
# regeneration (or a hand edit of generated code) would pass every other job.
# Runs the same Makefile targets as a developer would, so the pinned tool
# versions live in one place (Makefile `tools`).
# ----------------------------------------------------------------------------
generate-check:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - make tools
    - make check-generate

# ----------------------------------------------------------------------------
# vulncheck — CVE analysis with govulncheck (the official Go vulnerability
# scanner). It reports only vulnerabilities whose affected symbols our code can
# actually REACH, so it is far less noisy than a plain dependency-version diff.
#
# Gating: fails the pipeline on a reachable vulnerability that has a fix
# available, so a release can't ship a CVE we could simply have upgraded away.
# Advisories with no fixed version in our dependency line (currently the two
# Moby daemon-side ones — we only import the docker client SDK) are reported but
# do not fail; VULNCHECK_ALLOW lists those GO-IDs, with a comment saying why.
# Clear an entry from that list once its module ships a fix in a line we use.
#
# The JSON output is kept as an artifact so a release can be audited later.
# ----------------------------------------------------------------------------
vulncheck:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  variables:
    # GO-ID: reason. Reachable-but-unfixable in our dependency line.
    #   GO-2026-4887 / GO-2026-4883 — Moby daemon AuthZ-plugin + plugin-privilege
    #   issues. Fixed only in github.com/moby/moby/v2; the docker/docker line we
    #   use as a CLIENT SDK has no fix, and we import no daemon-side package.
    VULNCHECK_ALLOW: "GO-2026-4887 GO-2026-4883"
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - "$(go env GOPATH)/bin/govulncheck -format json ./... > govulncheck.json || true"
    - "$(go env GOPATH)/bin/govulncheck ./... || true"   # human-readable log
    - |
      # Fail only on a reachable vulnerability that HAS a fix and is not allowlisted.
      python3 - "$VULNCHECK_ALLOW" <<'PY'
      import json, sys
      allow = set(sys.argv[1].split()) if len(sys.argv) > 1 else set()
      osv, called, fixed = {}, set(), {}
      # govulncheck -format json emits CONCATENATED (multi-line) JSON objects,
      # not one per line — stream them with raw_decode.
      def messages(path):
          data = open(path).read()
          dec, i = json.JSONDecoder(), 0
          while i < len(data):
              while i < len(data) and data[i].isspace():
                  i += 1
              if i >= len(data):
                  return
              obj, i = dec.raw_decode(data, i)
              if isinstance(obj, dict):
                  yield obj
      for msg in messages("govulncheck.json"):
          if "osv" in msg:
              o = msg["osv"]
              osv[o["id"]] = o
              for a in o.get("affected", []):
                  for r in a.get("ranges", []):
                      for ev in r.get("events", []):
                          if ev.get("fixed"):
                              fixed[o["id"]] = ev["fixed"]
          f = msg.get("finding")
          # A finding with a symbol-level trace frame is reachable from our code.
          if f and any(t.get("function") for t in (f.get("trace") or [])):
              called.add(f["osv"])
      blocking = []
      for vid in sorted(called):
          if vid in allow:
              print(f"allowlisted (no fix in our line): {vid}")
              continue
          if vid in fixed:
              blocking.append((vid, fixed[vid]))
          else:
              print(f"reachable, no fixed version available: {vid}")
      for vid, fx in blocking:
          aliases = ",".join(osv.get(vid, {}).get("aliases", []))
          print(f"BLOCKING: {vid} ({aliases}) — fix available: {fx}")
      if blocking:
          print(f"\n{len(blocking)} reachable vulnerability(ies) with an available fix — upgrade the dependency.")
          sys.exit(1)
      print("\nNo blocking vulnerabilities.")
      PY
  artifacts:
    when: always
    paths:
      - govulncheck.json
    expire_in: 4 weeks

# Code navigation index (SCIP) for this `go 1.27` module. scip-go is the
# maintained Go indexer; the index is published as a downloadable artifact.
# NOTE: this GitLab instance rejects the `reports: lsif` upload with a 500, so we
# publish index.scip as a plain artifact instead of wiring it into the UI's code
# intelligence — switch `paths` back to `reports: { lsif: index.scip }` if the
# instance gains SCIP/LSIF support. allow_failure keeps it non-gating.
code_navigation:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  allow_failure: true
  script:
    - go install github.com/scip-code/scip-go/cmd/scip-go@latest
    - "$(go env GOPATH)/bin/scip-go index"
  artifacts:
    paths:
      - index.scip
  rules:
    - *semver-tag
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ----------------------------------------------------------------------------
# build — cross-compile the cli for all operator platforms
#   Runs on branch/MR pipelines (dev, stamped with the short SHA) and on
#   semver tags (release, stamped with the version). Non-semver tags are skipped.
# ----------------------------------------------------------------------------
build-cli:
  stage: build
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "building cli version $VERSION"
    - mkdir -p dist
    - |
      for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
        os="${target%/*}"; arch="${target#*/}"; ext=""
        [ "$os" = "windows" ] && ext=".exe"
        out="dist/swarmexec-${os}-${arch}${ext}"
        echo "  -> $out"
        CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
          -ldflags "-s -w -X main.version=${VERSION}" \
          -o "$out" ./client/cmd/swarmexec
      done
    - (cd dist && sha256sum swarmexec-* > SHA256SUMS)
    - ls -la dist
    # On a release tag, publish the binaries to the generic Package Registry —
    # permanent and (on this public project) publicly downloadable, unlike job
    # artifacts (member-only + expire_in). The Release links below point here.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "uploading binaries to generic package swarmexec/$CI_COMMIT_TAG"
        for f in dist/*; do
          name="$(basename "$f")"
          echo "  -> $name"
          curl --fail --silent --show-error \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$f" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/swarmexec/${CI_COMMIT_TAG}/${name}"
        done
      fi
  artifacts:
    name: "swarmexec-cli-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/
    expire_in: 4 weeks
  rules:
    - *semver-tag                 # release: stamped with the version
    - if: $CI_COMMIT_TAG          # any non-semver tag: do not build
      when: never
    - when: on_success            # branch / MR: dev build

# ----------------------------------------------------------------------------
# image — build the agent image and push it to the GitLab Container Registry
#   default branch (no tag) -> :main and :<short-sha>  (dev)
#   semver tag on main      -> :<version> and :latest  (release)
# ----------------------------------------------------------------------------
agent-image:
  stage: image
  # Build with Kaniko (no Docker daemon, no privileged mode). This runner cannot
  # run docker:dind — the service is unreachable (TLS certs not shared on 2376;
  # host "docker" unresolvable on 2375), which means dind never starts. Kaniko
  # builds the Dockerfile in-process and pushes straight to the registry.
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # Registry auth for Kaniko (it reads /kaniko/.docker/config.json). Always the
    # GitLab registry; additionally Docker Hub when DOCKERHUB_USER/TOKEN are set,
    # so a release can be mirrored there in the same build.
    - mkdir -p /kaniko/.docker
    - |
      AUTHS="\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}"
      if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        AUTHS="$AUTHS,\"https://index.docker.io/v1/\":{\"auth\":\"$(printf '%s:%s' "$DOCKERHUB_USER" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')\"}"
      fi
      echo "{\"auths\":{$AUTHS}}" > /kaniko/.docker/config.json
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/agent"
      # Docker Hub mirror target (releases only). Defaults to the login
      # namespace; override with DOCKERHUB_IMAGE. Empty when no Hub creds.
      HUB_IMAGE=""
      if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        HUB_IMAGE="${DOCKERHUB_IMAGE:-docker.io/$DOCKERHUB_USER/swarmexec-agent}"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Release: primary tag = the git tag (e.g. v1.2.3).
        VERSION="$CI_COMMIT_TAG"
        DESTS="--destination $IMAGE:$VERSION"
        [ -n "$HUB_IMAGE" ] && DESTS="$DESTS --destination $HUB_IMAGE:$VERSION"
        # Add :latest only for STABLE releases (a semver prerelease has a "-..."
        # segment before any "+build" metadata, e.g. v1.2.3-rc.1).
        base="${CI_COMMIT_TAG%%+*}"
        case "$base" in
          *-*) echo "prerelease $VERSION — leaving :latest untouched" ;;
          *)   DESTS="$DESTS --destination $IMAGE:latest"
               [ -n "$HUB_IMAGE" ] && DESTS="$DESTS --destination $HUB_IMAGE:latest" ;;
        esac
      else
        # Dev build on the default branch — GitLab registry only, never Hub.
        VERSION="$CI_COMMIT_SHORT_SHA"
        DESTS="--destination $IMAGE:$VERSION --destination $IMAGE:main"
      fi
      echo "building $IMAGE  ->  $DESTS"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/agent/Dockerfile" \
        --build-arg "VERSION=$VERSION" \
        $DESTS
  rules:
    - *semver-tag                 # release: :<version> (+ :latest if stable)
    - if: $CI_COMMIT_TAG          # any non-semver tag: do not push
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # dev: :<sha> + :main

# ----------------------------------------------------------------------------
# site-image — build the swarm-exec.cloud-surfers.net landing page image (nginx). The
# deployed service tracks :latest (Watchtower auto-updates it). :latest is
# refreshed both on a release (version baked in) and when site/ changes on the
# default branch (version shown as "latest"; the release/download links are
# always-latest permalinks either way).
# ----------------------------------------------------------------------------
site-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/site"
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
        # Push both the git tag (v1.6.0) and the bare semver (1.6.0): the site
        # deploy trigger passes the semver as VERSION and pulls $IMAGE:$VERSION.
        DESTS="--destination $IMAGE:$VERSION --destination $IMAGE:${CI_COMMIT_TAG#v}"
        base="${CI_COMMIT_TAG%%+*}"
        case "$base" in
          *-*) echo "prerelease $VERSION — leaving :latest untouched" ;;
          *)   DESTS="$DESTS --destination $IMAGE:latest" ;;
        esac
      else
        # Default-branch site change: refresh :latest (+ :main) so the deployed
        # service updates. No release version to bake, so show "latest".
        VERSION="latest"
        DESTS="--destination $IMAGE:latest --destination $IMAGE:main"
      fi
      echo "building $IMAGE  ->  $DESTS"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/site/Dockerfile" \
        --build-arg "VERSION=$VERSION" \
        $DESTS
  rules:
    - *semver-tag                 # release: bake version, push :<version> + :latest
    - if: $CI_COMMIT_TAG          # any non-semver tag: do not push
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # dev: only when the site changes
      changes:
        - site/**/*

# ----------------------------------------------------------------------------
# release — publish a GitLab Release for the semver tag, linking the artifacts
# ----------------------------------------------------------------------------
release-publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-cli
      artifacts: true
    - job: agent-image
  script:
    - echo "publishing GitLab Release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "swarmexec $CI_COMMIT_TAG"
    description: |
      Automated release for `$CI_COMMIT_TAG`.

      Container image: `$CI_REGISTRY_IMAGE/agent:$CI_COMMIT_TAG`
      (stable releases are also tagged `:latest`). cli binaries are attached below.
    assets:
      # Links point at the generic Package Registry (uploaded by build-cli):
      # permanent and publicly downloadable on this public project, unlike job
      # artifacts. filepath gives each asset a stable vanity path, enabling the
      # "always latest" permalinks used by the swarm-exec.cloud-surfers.net landing page:
      # <project>/-/releases/permalink/latest/downloads/bin/<name>.
      links:
        - name: swarmexec-linux-amd64
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG/swarmexec-linux-amd64"
          filepath: /bin/swarmexec-linux-amd64
        - name: swarmexec-linux-arm64
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG/swarmexec-linux-arm64"
          filepath: /bin/swarmexec-linux-arm64
        - name: swarmexec-darwin-amd64
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG/swarmexec-darwin-amd64"
          filepath: /bin/swarmexec-darwin-amd64
        - name: swarmexec-darwin-arm64
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG/swarmexec-darwin-arm64"
          filepath: /bin/swarmexec-darwin-arm64
        - name: swarmexec-windows-amd64.exe
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG/swarmexec-windows-amd64.exe"
          filepath: /bin/swarmexec-windows-amd64.exe
        - name: SHA256SUMS
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG/SHA256SUMS"
          filepath: /bin/SHA256SUMS
  rules:
    - *semver-tag

# ----------------------------------------------------------------------------
# dockerhub-description — sync the Docker Hub repo's short + full description
# from dockerhub/overview.md on every stable release.
#
# NB: the Hub "update description" API rejects Personal Access Tokens, so this
# uses password login (DOCKERHUB_PASSWORD) — use a dedicated bot account
# without 2FA that has write access to the repo. The job is skipped (not
# failed) when the password isn't configured, so image pushes still work.
# ----------------------------------------------------------------------------
dockerhub-description:
  stage: release
  image: alpine:3
  needs:
    - job: agent-image
  before_script:
    - apk add --no-cache curl jq >/dev/null
  script:
    - |
      if [ -z "$DOCKERHUB_PASSWORD" ]; then
        echo "DOCKERHUB_PASSWORD not set — skipping Docker Hub description sync."
        exit 0
      fi
      # Repo path (namespace/name). Strip any docker.io/ prefix from an override.
      REPO="${DOCKERHUB_IMAGE:-$DOCKERHUB_USER/swarmexec-agent}"
      REPO="${REPO#docker.io/}"
      SHORT="Cluster-wide docker exec/logs/volumes for Docker Swarm — the per-node agent."
      SHORT="$(printf '%s' "$SHORT" | cut -c1-100)"   # Hub caps short description at 100 chars
      echo "syncing description for $REPO"
      TOKEN="$(curl -sf -H 'Content-Type: application/json' \
        -d "$(jq -n --arg u "$DOCKERHUB_USER" --arg p "$DOCKERHUB_PASSWORD" '{username:$u,password:$p}')" \
        https://hub.docker.com/v2/users/login/ | jq -r .token)"
      if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
        echo "Docker Hub login failed (check DOCKERHUB_USER/DOCKERHUB_PASSWORD; a 2FA account cannot use password login)." >&2
        exit 1
      fi
      curl -sf -X PATCH -H "Authorization: JWT $TOKEN" -H 'Content-Type: application/json' \
        --data "$(jq -n --arg d "$SHORT" --rawfile f dockerhub/overview.md '{description:$d, full_description:$f}')" \
        "https://hub.docker.com/v2/repositories/$REPO/" >/dev/null
      echo "Docker Hub description updated for $REPO"
  rules:
    # Stable releases only (skip prereleases like v1.2.3-rc.1).
    - if: '$CI_COMMIT_TAG =~ /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/'

# ----------------------------------------------------------------------------
# deploy — Landing-Page-Deploy im Infrastruktur-Repo anstossen.
#   Laeuft nur bei einem stabilen/prerelease Semver-Tag und erst, nachdem
#   site-image das :<version>-Image gepusht hat. Die Ziel-Pipeline
#   (infrastruktur/swar-exec-site) rendert das Stackfile mit dieser VERSION
#   und deployt den Swarm-Stack.
#
#   Angestossen ueber einen PIPELINE-TRIGGER-TOKEN (nicht die trigger:-Bridge),
#   der ohne die Job-Token-Allowlist des Ziel-Projekts auskommt. Voraussetzung
#   (einmalig): im Ziel-Projekt unter Settings > CI/CD > Pipeline trigger tokens
#   einen Token erzeugen und ihn hier als maskierte, geschuetzte CI/CD-Variable
#   SITE_DEPLOY_TRIGGER_TOKEN hinterlegen.
#   Fire-and-forget: der Job wartet NICHT auf das Ergebnis der Ziel-Pipeline
#   (das leistete die fruehere trigger:-Bridge mit strategy: depend).
# ----------------------------------------------------------------------------
deploy-site:
  stage: deploy
  image: alpine:3
  needs:
    - job: site-image
  rules:
    - *semver-tag
  before_script:
    - apk add --no-cache curl >/dev/null
  script:
    - |
      if [ -z "$SITE_DEPLOY_TRIGGER_TOKEN" ]; then
        echo "SITE_DEPLOY_TRIGGER_TOKEN not set — cannot trigger the site deploy."
        echo "Create a pipeline trigger token in infrastruktur/swar-exec-site"
        echo "(Settings > CI/CD > Pipeline trigger tokens) and add it here as a"
        echo "masked, protected CI/CD variable."
        exit 1
      fi
      # The downstream deploy pipeline requires both IMAGE (the site image repo)
      # and VERSION. VERSION must be the bare semver (1.6.0), not the git tag
      # (v1.6.0); omitting IMAGE / sending the v-prefixed tag made the trigger
      # return HTTP 400. The downstream deploys $IMAGE:$VERSION.
      SEMVER="${CI_COMMIT_TAG#v}"
      echo "triggering site deploy for $CI_COMMIT_TAG (semver $SEMVER)"
      curl --fail --silent --show-error --request POST \
        --form "token=$SITE_DEPLOY_TRIGGER_TOKEN" \
        --form "ref=main" \
        --form "variables[IMAGE]=$CI_REGISTRY_IMAGE/site" \
        --form "variables[VERSION]=$SEMVER" \
        "$CI_API_V4_URL/projects/infrastruktur%2Fswar-exec-site/trigger/pipeline"

# ----------------------------------------------------------------------------
# mirror-github — push the released state to the public GitHub mirror, then
# publish the SAME binaries there as a GitHub Release.
#
# Why not a GitHub Action for the release half: an Action would have to REBUILD
# the binaries on GitHub, and two builds of one version are two different files.
# The SHA256SUMS on GitHub would then not match the SHA256SUMS on GitLab, for a
# release that is nominally the same — and a checksum that depends on where you
# downloaded from is worse than no checksum. This uploads the exact artifacts
# build-cli produced, so both places serve identical bytes and one checksum file
# is true in both. It also keeps the token count at one and the CI in one place.
#
# Deliberately NOT GitLab's built-in push mirroring (Settings > Repository >
# Mirroring repositories), which would copy every push. This runs on a semver
# tag only, so the mirror shows released states and nothing else: no in-flight
# branches, no half-finished work, and every commit visible there is one that
# passed the release gate.
#
# Pushes the default branch plus all tags, never `--mirror` and never `--force`:
# a mirror that deletes or overwrites is one accepted pull request away from
# destroying someone's commit. If GitHub has diverged the push FAILS, which is
# the honest outcome — it means somebody committed there and that has to be
# resolved by a human, not silently discarded.
#
# Needs two CI/CD variables:
#   GITHUB_MIRROR_REPO   owner/name of the target repo, e.g. cloud-surfers/swarmexec
#   GITHUB_MIRROR_TOKEN  a fine-grained PAT for that repo with Contents: write,
#                        masked AND protected (semver tags are protected refs)
# The token reaches git through a credential file rather than the remote URL, so
# it cannot turn up in a log line or in a git error message.
# ----------------------------------------------------------------------------
mirror-github:
  stage: deploy
  image: alpine:3
  needs:
    - job: release-publish
    - job: build-cli
      artifacts: true # dist/ — the exact files GitLab released
  rules:
    - *semver-tag
  variables:
    GIT_DEPTH: "0" # a mirror needs the whole history, not the CI clone's slice
  before_script:
    - apk add --no-cache git ca-certificates curl jq >/dev/null
  # The tag is already published by the time this runs, so a GitHub outage must
  # not turn a finished release red.
  allow_failure: true
  script:
    - |
      if [ -z "$GITHUB_MIRROR_REPO" ] || [ -z "$GITHUB_MIRROR_TOKEN" ]; then
        echo "GITHUB_MIRROR_REPO and/or GITHUB_MIRROR_TOKEN not set - nothing mirrored."
        echo "Create the repository on GitHub, then add both as CI/CD variables"
        echo "(Settings > CI/CD > Variables); the token masked and protected."
        exit 1
      fi
    - |
      set +x
      git config --global credential.helper store
      printf 'https://x-access-token:%s@github.com\n' "$GITHUB_MIRROR_TOKEN" > ~/.git-credentials
      chmod 600 ~/.git-credentials
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # The CI checkout is a detached HEAD at the tag; fetch the branch itself so
    # the mirror gets a branch and not an orphaned commit.
    - git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - |
      TARGET="https://github.com/${GITHUB_MIRROR_REPO}.git"
      echo "mirroring $CI_COMMIT_TAG to $GITHUB_MIRROR_REPO"
      git push "$TARGET" "refs/remotes/origin/${CI_DEFAULT_BRANCH}:refs/heads/${CI_DEFAULT_BRANCH}"
      git push "$TARGET" --tags
      echo "mirrored ${CI_DEFAULT_BRANCH} and all tags"
    # The release comes after the push, and in the same job, because a release
    # for a tag GitHub does not have yet would create a second, unreviewed tag
    # out of thin air. Ordering by `needs` would make that a pipeline detail; in
    # one job it is the order of two lines.
    - |
      set +x
      # The token goes in a curl config file rather than on the command line:
      # an argv is readable by every other process on the runner, a 0600 file
      # is not.
      umask 077
      printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_MIRROR_TOKEN" > /tmp/gh.curlrc
      printf 'header = "Accept: application/vnd.github+json"\n' >> /tmp/gh.curlrc
      printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n' >> /tmp/gh.curlrc
    - |
      . "$CI_PROJECT_DIR/ci/release-post-lib.sh"
      API="https://api.github.com/repos/${GITHUB_MIRROR_REPO}"
      GH() { curl --silent --show-error --config /tmp/gh.curlrc "$@"; }
      # GHW is GH for writes: it fails on an HTTP error and prints GitHub's reason.
      # A bare --fail drops the body, and "422" alone is how v1.19.0 was lost.
      GHW() {
        _out="$(GH --fail-with-body "$@")" || { printf '%s\n' "$_out" >&2; return 22; }
        printf '%s' "$_out"
      }

      # A semver prerelease carries a "-suffix" — the same rule the image jobs
      # use to decide whether :latest moves.
      case "$CI_COMMIT_TAG" in
        *-*) PRE=true ;;
        *)   PRE=false ;;
      esac
      WANT="$(ls dist | wc -l)"

      # GitHub's immutable releases take no assets once published: v1.19.0 was
      # published first and then refused every upload with a 422. So the release
      # is built as a draft, filled, and published last — the order GitHub
      # prescribes, and harmless where immutability is off.
      #
      # A published release is therefore final. Re-running the job over one is
      # fine when it is complete, and an error with the reason when it is not:
      # nothing this job can do adds the missing files.
      PUB="$(GH "$API/releases/tags/$CI_COMMIT_TAG")"
      if [ -n "$(printf '%s' "$PUB" | jq -r '.id // empty')" ]; then
        HAVE="$(printf '%s' "$PUB" | jq '.assets | length')"
        if [ "$HAVE" -ge "$WANT" ]; then
          echo "GitHub release $CI_COMMIT_TAG is already published with $HAVE assets - nothing to do"
          exit 0
        fi
        echo "GitHub release $CI_COMMIT_TAG is published with $HAVE of $WANT assets."
        echo "immutable=$(printf '%s' "$PUB" | jq -r '.immutable') - a published immutable release"
        echo "takes no further assets; the binaries are on the GitLab release."
        exit 1
      fi

      # Re-runnable: a draft left by an interrupted run is picked up rather than
      # doubled. /releases/tags/ never returns drafts, so they are found in the
      # list.
      ID="$(GH "$API/releases?per_page=100" \
            | jq -r --arg t "$CI_COMMIT_TAG" '[.[] | select(.draft and .tag_name == $t)][0].id // empty')"
      if [ -z "$ID" ]; then
        echo "creating draft GitHub release $CI_COMMIT_TAG (prerelease=$PRE)"
        # The annotated tag message, exactly as the GitLab release and both
        # announcement posts use it. One changelog, four places.
        NOTES="$(release_notes)"
        ID="$(jq -n --arg tag "$CI_COMMIT_TAG" --arg name "swarmexec $CI_COMMIT_TAG" \
                    --arg body "$NOTES" --argjson pre "$PRE" \
                    '{tag_name:$tag, name:$name, body:$body, prerelease:$pre, draft:true}' \
              | GHW --request POST --data @- "$API/releases" | jq -r '.id')"
      else
        echo "draft GitHub release $CI_COMMIT_TAG exists (id $ID) - reusing it"
      fi
      [ -n "$ID" ] && [ "$ID" != null ] || { echo "could not create or find the draft release"; exit 1; }

      for f in dist/*; do
        name="$(basename "$f")"
        # Same name twice is a 422, so a re-run replaces rather than appends.
        # (Only a draft allows that, which is the other reason to stay one.)
        old="$(GH "$API/releases/$ID/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id')"
        [ -n "$old" ] && GHW --request DELETE "$API/releases/assets/$old" >/dev/null
        echo "  -> $name"
        GHW --request POST \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$f" \
            "https://uploads.github.com/repos/${GITHUB_MIRROR_REPO}/releases/$ID/assets?name=$name" >/dev/null
      done

      # Publishing is the last step: from here on the release is what it is.
      jq -n --argjson pre "$PRE" '{draft:false, prerelease:$pre}' \
        | GHW --request PATCH --data @- "$API/releases/$ID" >/dev/null
      echo "published $CI_COMMIT_TAG on GitHub with $WANT assets"
  after_script:
    - rm -f ~/.git-credentials /tmp/gh.curlrc

# ----------------------------------------------------------------------------
# Release announcements. Both jobs COMPOSE a post from the annotated tag message
# and keep it as an artifact; a human publishes it. The artifact is the point:
# for v1.17.1 the LinkedIn API accepted a DRAFT, returned its URN, and the draft
# was not findable in the Page admin UI, which does not list API-created drafts.
# An announcement nobody can open is not a four-eyes gate.
#
# artifacts:when: always, because the text is worth keeping precisely when the
# posting step failed — that is when someone has to publish it by hand.
# ----------------------------------------------------------------------------
.release-post:
  stage: deploy
  image: alpine:3
  needs:
    - job: release-publish
  rules:
    - *semver-tag
  before_script:
    - apk add --no-cache curl jq >/dev/null
  # Never fails a release: the tag is already published by the time these run.
  allow_failure: true

# linkedin-announce — builds linkedin-post-<tag>.txt, then additionally creates
# a DRAFT via the REST Posts API when LINKEDIN_AUTHOR_URN plus an auth method
# are configured (preferred: the refresh-token trio LINKEDIN_CLIENT_ID/SECRET/
# REFRESH_TOKEN; fallback: LINKEDIN_ACCESS_TOKEN). LINKEDIN_POST=0 builds the
# artifact only; LINKEDIN_DRY_RUN=1 also prints the payload. Prereleases skip.
linkedin-announce:
  extends: .release-post
  script:
    - sh ci/linkedin-announce.sh
  artifacts:
    when: always
    expire_in: 1 year
    expose_as: "LinkedIn post"
    paths:
      - release-posts/linkedin.txt

# reddit-post — builds reddit-post-<tag>.md and posts NOTHING. Which subreddit,
# which flair and whether a release is worth a post at all is a judgement call,
# and whoever posts has to be there for the comments. See ci/reddit-post.sh.
# ----------------------------------------------------------------------------
# package-manifests — a Homebrew formula and a Scoop manifest for the release,
# generated from the SHA256SUMS this pipeline built, pointing at the public
# package-registry downloads. Kept as artifacts, and pushed by publish-packages.
# ----------------------------------------------------------------------------
package-manifests:
  stage: deploy
  image: alpine:3
  needs:
    - job: build-cli
      artifacts: true
  rules:
    - *semver-tag
  script:
    - sh ci/package-manifests.sh "$CI_COMMIT_TAG"
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/swarmexec/$CI_COMMIT_TAG"
        dist/SHA256SUMS packaging
  artifacts:
    expire_in: 1 year
    expose_as: "Package manifests"
    paths:
      - packaging/

# ----------------------------------------------------------------------------
# publish-packages — pushes those two files to the public Homebrew tap and
# Scoop bucket, so `brew upgrade` / `scoop update` pick up the release. Set up
# once (Settings > CI/CD > Variables):
#   GITHUB_TAP_REPO        e.g. ekrotov/homebrew-swarmexec   (repo must exist)
#   GITHUB_SCOOP_REPO      e.g. ekrotov/scoop-swarmexec      (repo must exist)
#   GITHUB_PACKAGES_TOKEN  fine-grained token, Contents: read and write on both
#                          repos (masked, protected); falls back to
#                          GITHUB_MIRROR_TOKEN if that one covers them
# An unset repository is skipped with a note; a prerelease is never published.
# Like the GitHub mirror, a failure here must not turn a finished release red.
# ----------------------------------------------------------------------------
publish-packages:
  stage: deploy
  image: alpine:3
  needs:
    - job: package-manifests
      artifacts: true
  rules:
    - *semver-tag
  allow_failure: true
  before_script:
    - apk add --no-cache git ca-certificates >/dev/null
  script:
    - sh ci/publish-packages.sh "$CI_COMMIT_TAG" packaging

reddit-post:
  extends: .release-post
  script:
    - sh ci/reddit-post.sh
  artifacts:
    when: always
    expire_in: 1 year
    expose_as: "Reddit post"
    paths:
      - release-posts/reddit.md
