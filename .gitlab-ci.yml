# swarmexec CI / CD
#
# Stages:
#   .pre    — verify-tag-on-main: gate that a release tag actually sits on main
#   test    — go vet, gofmt check, race tests, code navigation
#   build   — cross-compile the cli (linux / macOS / windows) -> artifacts
#   image   — build the agent image and push it to the GitLab Container Registry
#   release — publish a GitLab Release for the tag
#
# Versioning:
#   * Branch / MR pipelines  -> dev builds stamped with the short commit SHA.
#   * A SEMANTIC-VERSION git tag (e.g. v1.2.3) builds a release stamped with that
#     version — but ONLY if the tagged commit is on the default branch (main).
#     The verify-tag-on-main gate in `.pre` fails otherwise, which stops every
#     later stage, so no release is produced for a tag that is not on main.

stages:
  - test
  - build
  - image
  - release

variables:
  GO_IMAGE: "golang:1.25"
  PROTO_VER: "swarmexec/v1"
  GOPATH: "$CI_PROJECT_DIR/.gocache"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# A semantic-version tag: vMAJOR.MINOR.PATCH with an optional -prerelease
# (the leading "v" is optional). Anchored so it can be reused in several jobs.
# SemVer "+build" metadata is intentionally excluded: "+" is not a valid Docker
# image-tag character, so such tags could not be published as an image.
.semver-tag: &semver-tag
  if: '$CI_COMMIT_TAG =~ /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$/'

# Reusable Go module cache (keyed on go.sum).
.go-cache: &go-cache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gocache/pkg/mod

# ----------------------------------------------------------------------------
# .pre — release gate: a semver tag must point at a commit that is on main
# ----------------------------------------------------------------------------
verify-tag-on-main:
  stage: .pre
  image: $GO_IMAGE
  variables:
    GIT_DEPTH: "0" # full history so merge-base can see both the tag and main
  script:
    - git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" "refs/remotes/origin/${CI_DEFAULT_BRANCH}"; then
        echo "OK: tag $CI_COMMIT_TAG ($CI_COMMIT_SHORT_SHA) is on $CI_DEFAULT_BRANCH — release allowed"
      else
        echo "REJECT: tag $CI_COMMIT_TAG ($CI_COMMIT_SHORT_SHA) is NOT on $CI_DEFAULT_BRANCH."
        echo "Releases are only built from tags on the default branch. Aborting."
        exit 1
      fi
  rules:
    - *semver-tag

# ----------------------------------------------------------------------------
# test
# ----------------------------------------------------------------------------
test:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - go vet ./...
    - |
      if [ -n "$(gofmt -l agent client internal)" ]; then
        echo "gofmt: the following files need formatting:"
        gofmt -l agent client internal
        exit 1
      fi
    - go test -race ./...

# Code navigation (code-intelligence in the GitLab UI). Replaces GitLab's default
# LSIF template, whose archived sourcegraph/lsif-go image bundles a Go too old to
# parse this module's `go 1.25` directive. scip-go is the maintained Go indexer.
# allow_failure keeps the pipeline green regardless of the GitLab version's SCIP
# support — the build/test/image jobs are what gate the pipeline.
code_navigation:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  allow_failure: true
  script:
    - go install github.com/scip-code/scip-go/cmd/scip-go@latest
    - "$(go env GOPATH)/bin/scip-go index"
  artifacts:
    reports:
      lsif: index.scip
  rules:
    - *semver-tag
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ----------------------------------------------------------------------------
# build — cross-compile the cli for all operator platforms
#   Runs on branch/MR pipelines (dev, stamped with the short SHA) and on
#   semver tags (release, stamped with the version). Non-semver tags are skipped.
# ----------------------------------------------------------------------------
build-cli:
  stage: build
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "building cli version $VERSION"
    - mkdir -p dist
    - |
      for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
        os="${target%/*}"; arch="${target#*/}"; ext=""
        [ "$os" = "windows" ] && ext=".exe"
        out="dist/swarmexec-${os}-${arch}${ext}"
        echo "  -> $out"
        CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
          -ldflags "-s -w -X main.version=${VERSION} -X main.protoVersion=${PROTO_VER}" \
          -o "$out" ./client/cmd/swarmexec
      done
    - (cd dist && sha256sum swarmexec-* > SHA256SUMS)
    - ls -la dist
  artifacts:
    name: "swarmexec-cli-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/
    expire_in: 4 weeks
  rules:
    - *semver-tag                 # release: stamped with the version
    - if: $CI_COMMIT_TAG          # any non-semver tag: do not build
      when: never
    - when: on_success            # branch / MR: dev build

# ----------------------------------------------------------------------------
# image — build the agent image and push it to the GitLab Container Registry
#   default branch (no tag) -> :main and :<short-sha>  (dev)
#   semver tag on main      -> :<version> and :latest  (release)
# ----------------------------------------------------------------------------
agent-image:
  stage: image
  # Build with Kaniko (no Docker daemon, no privileged mode). This runner cannot
  # run docker:dind — the service is unreachable (TLS certs not shared on 2376;
  # host "docker" unresolvable on 2375), which means dind never starts. Kaniko
  # builds the Dockerfile in-process and pushes straight to the registry.
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # Registry auth for Kaniko (it reads /kaniko/.docker/config.json).
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/agent"
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Release: primary tag = the git tag (e.g. v1.2.3).
        VERSION="$CI_COMMIT_TAG"
        DESTS="--destination $IMAGE:$VERSION"
        # Add :latest only for STABLE releases (a semver prerelease has a "-..."
        # segment before any "+build" metadata, e.g. v1.2.3-rc.1).
        base="${CI_COMMIT_TAG%%+*}"
        case "$base" in
          *-*) echo "prerelease $VERSION — leaving :latest untouched" ;;
          *)   DESTS="$DESTS --destination $IMAGE:latest" ;;
        esac
      else
        # Dev build on the default branch.
        VERSION="$CI_COMMIT_SHORT_SHA"
        DESTS="--destination $IMAGE:$VERSION --destination $IMAGE:main"
      fi
      echo "building $IMAGE  ->  $DESTS"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/agent/Dockerfile" \
        --build-arg "VERSION=$VERSION" \
        --build-arg "PROTO_VER=$PROTO_VER" \
        $DESTS
  rules:
    - *semver-tag                 # release: :<version> (+ :latest if stable)
    - if: $CI_COMMIT_TAG          # any non-semver tag: do not push
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # dev: :<sha> + :main

# ----------------------------------------------------------------------------
# release — publish a GitLab Release for the semver tag, linking the artifacts
# ----------------------------------------------------------------------------
release-publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-cli
      artifacts: true
    - job: agent-image
  script:
    - echo "publishing GitLab Release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "swarmexec $CI_COMMIT_TAG"
    description: |
      Automated release for `$CI_COMMIT_TAG`.

      Container image: `$CI_REGISTRY_IMAGE/agent:$CI_COMMIT_TAG`
      (stable releases are also tagged `:latest`). cli binaries are attached below.
    assets:
      links:
        - name: swarmexec-linux-amd64
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/swarmexec-linux-amd64?job=build-cli"
        - name: swarmexec-linux-arm64
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/swarmexec-linux-arm64?job=build-cli"
        - name: swarmexec-darwin-amd64
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/swarmexec-darwin-amd64?job=build-cli"
        - name: swarmexec-darwin-arm64
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/swarmexec-darwin-arm64?job=build-cli"
        - name: swarmexec-windows-amd64.exe
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/swarmexec-windows-amd64.exe?job=build-cli"
        - name: SHA256SUMS
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/SHA256SUMS?job=build-cli"
  rules:
    - *semver-tag
