# swarmexec agent — self-signed + shared-secret mode (Portainer-style).
#
# No server cert/key to provision: the agent generates its own server
# certificate at startup, with SANs taken from the Docker node info (hostname +
# advertised address). Clients skip server-cert verification and authenticate
# with the shared secret instead. Only ONE secret to manage.
#
# 1. Create the shared secret (any high-entropy string):
#      openssl rand -base64 32 | docker secret create swarmexec_agent_secret -
#
# 2. Deploy (the default image is public on Docker Hub, so no registry login):
#      docker stack deploy -c deploy/agent-stack-selfsigned.yml swarmexec
#    To pin a version or use the GitLab-registry mirror instead, set
#    SWARMEXEC_AGENT_IMAGE, e.g.:
#      export SWARMEXEC_AGENT_IMAGE=docker.io/logleio/swarmexec-agent:v1.1.3
#
# 3. Put the SAME secret in the client's ~/.config/swarmexec/config.yaml:
#      agent_secret: <the value you created above>
#      insecure: true        # self-signed agent — no CA to verify against
#      addr_mode: ip
#
# Optional: to ALSO keep per-operator client-cert identity, additionally provide
# a client CA as the swarmexec_ca secret and add -ca-cert=/run/secrets/swarmexec_ca
# to the command; clients then present their operator cert as usual.
#
# What `insecure: true` means here. The client does NOT send the shared secret:
# it sends a proof derived from the secret and the certificate of the connection
# it travels on, so a server answering an unverified connection learns nothing
# that works against a real agent. What it still means is that the agent is not
# authenticated to the client — someone on the path can terminate the connection
# and read what that session sends them. Use this mode on a network you trust;
# on one you do not, provision a CA and drop `insecure`.
#
# Once every client is on a version that sends the bound proof, add
# -allow-legacy-secret=false below: the agent then refuses the raw secret
# outright, so no client can put the credential on the wire by accident.

services:
  agent:
    image: ${SWARMEXEC_AGENT_IMAGE:-docker.io/logleio/swarmexec-agent:latest}
    command:
      - "-listen=:9443"
      - "-self-signed"
      - "-agent-secret-file=/run/secrets/swarmexec_agent_secret"
      - "-docker-host=unix:///var/run/docker.sock"
      - "-drain-timeout=5s"
      - "-log-format=json"
      - "-audit-dest=stdout"
    deploy:
      mode: global
      # Same label the CLI stamps on init-created agents, so `swarmexec down`,
      # doctor and re-init recognize a manifest-deployed agent by label rather
      # than by image name.
      labels:
        swarmexec.role: agent
      restart_policy:
        condition: any
      update_config:
        # stop-first (not start-first): the published port uses mode: host, so
        # only one task per node can bind 9443 at a time — the old task must
        # stop before the new one starts.
        order: stop-first
    secrets:
      - swarmexec_agent_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - swarmexec
    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host

networks:
  swarmexec:
    driver: overlay
    attachable: false

secrets:
  swarmexec_agent_secret:
    external: true
