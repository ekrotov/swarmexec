# Prometheus alerting rules for the swarmexec agent. Thresholds are starting
# points; the expressions are what matters.
groups:
  - name: swarmexec-agent
    rules:
      # The one signal that makes an attack attempt visible: requests that
      # passed transport authentication but were refused by the authorizer.
      # With the default AllowAll authorizer this stays at 0; under a policy a
      # burst means someone is trying what they may not.
      - alert: SwarmexecAuthDenialsRising
        expr: increase(swarmexec_auth_denials_total[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} authorization denials in 10m"

      # Agents on different builds behave differently, and doctor reports only
      # what the client compares against. Version skew that lasts beyond a
      # rollout means some node did not take the update.
      - alert: SwarmexecAgentVersionSkew
        expr: count(count by (version) (swarmexec_agent_info)) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "swarmexec agents run {{ $value }} different versions"

      # A node that refused a request because a cap was reached: either a
      # client is opening far more streams than a person would, or the cap is
      # too low for how the node is used (-max-streams, -max-forward-sidecars).
      - alert: SwarmexecLimitRefusals
        expr: increase(swarmexec_limit_refusals_total[10m]) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} refused {{ $value | humanize }} requests at its {{ $labels.limit }} cap"

      # The agent on a node is gone or its metrics port is not reachable.
      - alert: SwarmexecAgentDown
        expr: up{job="swarmexec-agent"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "swarmexec agent on {{ $labels.instance }} is not answering"
