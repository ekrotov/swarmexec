# swarmexec agent — global Swarm service.
#
# Releases publish the image to Docker Hub at docker.io/logleio/swarmexec-agent
# (public), tagged :<version> and :latest; the CI also mirrors it to the GitLab
# registry. The `image:` below tracks the latest release. Dev builds live only
# in the GitLab registry as :main / :<short-sha>.
#
# The Hub image is public, so no registry login is needed to pull it:
#   docker stack deploy -c deploy/agent-stack.yml swarmexec
#
# Create the required secrets first (see deploy/secrets.sh or the README):
#   docker secret create swarmexec_ca   ca.crt
#   docker secret create swarmexec_cert agent.crt
#   docker secret create swarmexec_key  agent.key
#
# The agent runs one task per node (mode: global), mounts the local Docker
# socket, and listens on the overlay network. The CLI reaches a node's agent
# via that node's address on the published port using mTLS.
services:
  agent:
    image: docker.io/logleio/swarmexec-agent:latest
    command:
      - "-listen=:9443"
      - "-ca-cert=/run/secrets/swarmexec_ca"
      - "-server-cert=/run/secrets/swarmexec_cert"
      - "-server-key=/run/secrets/swarmexec_key"
      - "-docker-host=unix:///var/run/docker.sock"
      - "-drain-timeout=5s"
      - "-log-format=json"
      - "-audit-dest=stdout"
    deploy:
      mode: global
      # Same label the CLI stamps on init-created agents, so `swarmexec down`,
      # doctor and re-init recognize a manifest-deployed agent by label rather
      # than by image name.
      labels:
        swarmexec.role: agent
      restart_policy:
        condition: any
      update_config:
        # stop-first (not start-first): the published port uses mode: host, so
        # only one task per node can bind 9443 at a time — the old task must
        # stop before the new one starts.
        order: stop-first
    secrets:
      - swarmexec_ca
      - swarmexec_cert
      - swarmexec_key
    volumes:
      # Read-write: interactive exec needs to write to the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - swarmexec
    ports:
      # mode: host publishes 9443 on each node's own interface (NOT the routing
      # mesh). With a global service this means CLI -> nodeN:9443 always reaches
      # the agent task ON nodeN, which is exactly the direct-routing model the
      # CLI relies on. Restrict exposure at the firewall/host level; mTLS is the
      # primary control.
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host

networks:
  swarmexec:
    driver: overlay
    attachable: false

secrets:
  swarmexec_ca:
    external: true
  swarmexec_cert:
    external: true
  swarmexec_key:
    external: true
