version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # The wire contract predates the lint gate and is deployed: agents and clients
  # of different versions talk to each other (CONTRACT.md §7). Each of these
  # rules would rename something that is on the wire or in the Go API:
  #   PACKAGE_DIRECTORY_MATCH / PACKAGE_VERSION_SUFFIX / SERVICE_SUFFIX change
  #     the gRPC method path (/swarmexec.Agent/...), so old and new peers could
  #     no longer call each other;
  #   RPC_REQUEST_STANDARD_NAME / RPC_RESPONSE_STANDARD_NAME rename message
  #     types used throughout agent and cli (ClientMessage, LogChunk, ...).
  # Everything else in STANDARD is enforced (make proto-check, CI generate-check).
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
