// The swarmexec wire protocol: the single definition of its messages, fields
// and RPCs. What they mean — transport, authentication, framing, lifecycles —
// is CONTRACT.md, which does not repeat this file. Generated Go code lands in
// internal/pb (make generate) and is shared by the cli and the agent; CI fails
// when it does not match this file.
syntax = "proto3";
package swarmexec;
option go_package = "swarmexec/internal/pb";

service Agent {
  // List containers on THIS node. Optional helper for discovery/validation.
  rpc ListContainers(ListRequest) returns (ListResponse);

  // Bidirectional interactive exec stream.
  // The first ClientMessage on the stream MUST carry a StartExec payload.
  rpc Exec(stream ClientMessage) returns (stream ServerMessage);

  // Stream a container's logs. Server-streaming: the agent reads the container
  // logs on its own node and forwards them as LogChunks until the request is
  // satisfied (or, with follow=true, until the client cancels the stream).
  rpc Logs(LogsRequest) returns (stream LogChunk);

  // Stream one container's runtime events from THIS node: health transitions,
  // OOM kills, exits with their code, starts and restarts. The manager carries
  // none of these — a task reads "running" while its container fails every
  // probe — so they can only come from the node.
  //
  // Deliberately ONE container, not the node's stream: the client opens this
  // over the connection it already holds for the view the operator has open, so
  // there is no fan-out, and nothing about the node's other containers (swarm
  // or not) crosses the wire.
  rpc WatchContainerEvents(WatchContainerEventsRequest) returns (stream ContainerEvent);

  // List volumes on THIS node. Swarm volumes are node-local, so the cli queries
  // every node and aggregates the results.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // Remove a volume on THIS node (authorized + audited). Fails if the volume is
  // in use; force does not override that (see RemoveVolumeRequest.force).
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);

  // Create a volume on THIS node (authorized + audited). Volumes are node-local,
  // so the cli targets a specific node's agent.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);

  // Forward a single TCP connection to a port inside a container on THIS node.
  // Bidirectional: one stream carries exactly one connection, so a local
  // listener opens a new stream per accepted conn (HTTP/2 multiplexes them over
  // the one transport). The first ClientMessage MUST carry a StartForward.
  rpc PortForward(stream ForwardClientMessage) returns (stream ForwardServerMessage);

  // Resource usage of the containers on THIS node. Unary on purpose: the agent
  // samples in the background and answers from memory, so a client polls this on
  // the refresh cycle it already has instead of holding a stream open per node.
  // It also solves the sampling problem — a CPU percentage needs two readings,
  // and the background sampler always has the previous one.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // List the images on THIS node, with what each costs on disk and whether a
  // running container is using it. Images are node-local and the manager has no
  // view of them at all, so the cli asks each node in turn.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

  // Reclaim image disk space on THIS node (authorized + audited). Destructive:
  // see PruneImagesRequest.all for the two very different things it can mean.
  rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);

  // What a prune would reclaim on THIS node, per category, plus the node's
  // prune schedule and the result of its last scheduled run. The agent measures
  // in the background (hourly) and answers from memory; measure_now asks for a
  // fresh measurement, which the agent rate-limits. See CONTRACT.md §3.7.
  rpc ReclaimStats(ReclaimStatsRequest) returns (ReclaimStatsResponse);

  // Reclaim disk space on THIS node for a set of categories, in order, each
  // authorized and audited on its own. Destructive. Supersedes PruneImages,
  // which stays for older clients. See CONTRACT.md §3.7.
  rpc Prune(PruneRequest) returns (PruneResponse);

  // What THIS node's Docker daemon knows about the endpoints on its swarm-scope
  // networks: the containers attached here, and the daemon's replicated
  // (networkdb) view of every service's tasks and of the network's peers.
  // Read-only, Docker API only. A client compares it with the manager's
  // running tasks to spot stale IP/MAC entries a node kept from an old network
  // state. See CONTRACT.md §3.9.
  rpc NetworkEndpoints(NetworkEndpointsRequest) returns (NetworkEndpointsResponse);

  // Kill one swarm task container on THIS node with SIGKILL (authorized as
  // "kill" + audited). Swarm notices the task failed and schedules a
  // replacement per the service's restart policy; the agent never restarts
  // anything itself. Refused for containers that are not swarm tasks. See
  // CONTRACT.md §3.10.
  rpc KillContainer(KillContainerRequest) returns (KillContainerResponse);

  // The node-local `docker container inspect` of one swarm task container on
  // THIS node, as the Engine's JSON (authorized as "inspect" +
  // audited). The manager's task inspect cannot show runtime state — health
  // probe output, the container's network settings, its real mounts — because
  // only the node's daemon has them. See CONTRACT.md §3.10.
  rpc InspectContainer(InspectContainerRequest) returns (InspectContainerResponse);

  // Report the agent's build and protocol version. Cheap, low-privilege probe
  // used by `swarmexec doctor` and for client/agent skew detection. Calling it
  // on an agent that predates this RPC yields gRPC Unimplemented, which the cli
  // turns into an "agent too old — run init --force" hint.
  rpc Version(VersionRequest) returns (VersionResponse);
}

message ListRequest {
  string service_filter = 1; // optional substring/label filter; empty = all
}

message ListResponse {
  repeated ContainerInfo containers = 1;
}

message ContainerInfo {
  string id = 1;       // full container ID
  string name = 2;     // container name
  string service = 3;  // swarm service name if known, else empty
  repeated string volumes = 4;  // names of named volumes this container mounts
  // TCP ports the container exposes (EXPOSE / published), container side,
  // deduplicated and ascending. TCP only, because PortForward is TCP only: a
  // UDP port here would be a suggestion that cannot work. Empty from agents
  // that predate the field — a client MUST treat it as a hint, never as the
  // list of forwardable ports.
  repeated uint32 ports = 5;
}

message ClientMessage {
  oneof payload {
    StartExec start = 1;  // MUST be the first message
    bytes stdin = 2;      // raw stdin bytes
    Resize resize = 3;    // terminal resize event
  }
}

message StartExec {
  string container_id = 1;     // full container ID to exec into
  repeated string cmd = 2;     // command + args, e.g. ["/bin/sh"]
  bool tty = 3;                // allocate a TTY
  uint32 width = 4;            // initial terminal width (columns)
  uint32 height = 5;           // initial terminal height (rows)
  repeated string env = 6;     // optional extra env, "KEY=VALUE"
  string working_dir = 7;      // optional working directory
  string user = 8;             // optional user, e.g. "1000:1000" or "root"
}

message Resize {
  uint32 width = 1;
  uint32 height = 2;
}

message ServerMessage {
  oneof payload {
    bytes stdout = 1;     // stdout bytes (also carries all output when tty=true)
    bytes stderr = 2;     // stderr bytes (only when tty=false)
    int32 exit_code = 3;  // sent once, as the final message before stream end
    string error = 4;     // terminal error; stream ends after this
  }
}

message LogsRequest {
  string container_id = 1;   // full container ID to read logs from
  bool follow = 2;           // keep streaming new log lines as they arrive
  uint32 tail = 3;           // last N lines to start from; 0 = all
  bool timestamps = 4;       // prefix each line with an RFC3339Nano timestamp
  uint32 since_seconds = 5;  // only logs newer than N seconds ago; 0 = no limit
}

message WatchContainerEventsRequest {
  string container_id = 1;  // full container ID to watch; exactly one
}
// ContainerEvent carries a typed SUBSET of a Docker event, not the event.
// Docker attaches the container's full label set to every event, and labels are
// operator-supplied strings that routinely hold things nobody meant to stream;
// forwarding them wholesale would make this RPC an exfiltration path for
// whatever a deployer happened to put in a label.
message ContainerEvent {
  string action = 1;          // raw docker action: "die", "oom", "start", "health_status: healthy"
  int64 time_unix_nano = 2;   // when the daemon recorded it
  int32 exit_code = 3;        // only meaningful when action is "die"; 0 otherwise
  string health = 4;          // healthy|unhealthy|starting — only for health_status actions
  string error = 5;           // terminal error; the stream ends after this
}
message LogChunk {
  oneof payload {
    bytes stdout = 1;  // stdout bytes (also carries all output for TTY containers)
    bytes stderr = 2;  // stderr bytes (non-TTY containers only)
    string error = 3;  // terminal error; stream ends after this
  }
}

message ListVolumesRequest {
  // with_size asks the agent to also compute each volume's on-disk size via the
  // docker disk-usage endpoint (du-style; can be slow). Off by default so the
  // plain listing stays fast.
  bool with_size = 1;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

message VolumeInfo {
  string name = 1;
  string driver = 2;
  string mountpoint = 3;
  string created_at = 4;  // RFC3339, if known
  string scope = 5;       // "local" or "global"
  // size_bytes is the on-disk size, only meaningful when size_known is true.
  // -1 means "not available" (e.g. non-local driver).
  int64 size_bytes = 6;
  // size_known is true when the agent actually computed the size (with_size
  // requested and disk-usage succeeded). It lets the client tell "0 bytes" from
  // "an older agent that doesn't report sizes" (which would default size_bytes
  // to 0).
  bool size_known = 7;
  // labels are the volume's metadata labels, as set at creation time.
  map<string, string> labels = 8;
}

message RemoveVolumeRequest {
  string name = 1;
  // Passed to the Engine's volume remove: a volume that is already gone is not
  // an error, and one its driver fails to remove is dropped anyway. It does
  // NOT override in-use — a volume a container still references is refused.
  bool force = 2;
}

message RemoveVolumeResponse {}

message CreateVolumeRequest {
  string name = 1;
  string driver = 2;                 // empty means "local"
  map<string, string> labels = 3;
  map<string, string> driver_opts = 4;
}

message CreateVolumeResponse {
  VolumeInfo volume = 1;             // the created volume
}

message StartForward {
  string container_id = 1;  // full container ID to forward into
  uint32 port = 2;          // TCP port inside the container
}

message ForwardClientMessage {
  oneof payload {
    StartForward start = 1;  // MUST be the first message
    bytes data = 2;          // raw bytes toward the container
  }
}

// ForwardReady is sent once, after the agent has established the connection to
// the target port and before any data. It lets the client distinguish "the
// target accepted" from "connected, but the peer has not spoken yet" — without
// it a forward pointing at a closed port looks healthy until the operator's
// own client times out.
message ForwardReady {}

message ForwardServerMessage {
  oneof payload {
    ForwardReady ready = 1;  // sent once, before any data
    bytes data = 2;          // raw bytes from the container
    string error = 3;        // terminal error; stream ends after this
  }
}

message VersionRequest {}

message VersionResponse {
  string version = 1;        // agent build version
  string proto_version = 2;  // wire protocol version
}

message StatsRequest {
  // container_ids narrows the answer to these containers; empty means every
  // container the agent is sampling. The cli sends the ids it is displaying so
  // a large node does not ship readings nobody looks at.
  repeated string container_ids = 1;
}

message StatsResponse {
  repeated ContainerStats stats = 1;

  // cpu_ready is false until the sampler has taken the TWO readings a CPU
  // percentage needs — it is a delta, unlike memory, which is valid from the
  // first sample. So a response can carry usable memory numbers with
  // cpu_ready=false, and the client renders "…" for CPU rather than a wrong 0%.
  bool cpu_ready = 2;

  // sampled_at is when the underlying sample was taken (RFC3339), so a client
  // can spot a stalled sampler rather than trusting stale numbers.
  string sampled_at = 3;

  // The node as a whole, for putting usage next to what the scheduler booked.
  // node_cpus is the online CPU count; usage percentages are relative to it
  // when a container has no CPU limit of its own.
  int64 node_cpus = 4;
  int64 node_memory_total_bytes = 5;
}

message ContainerStats {
  string container_id = 1;

  // cpu_percent is the same number `docker stats` prints: the share of ONE cpu,
  // so 250.0 means two and a half cores. Divide by cpu_limit_cores (or by
  // node_cpus when there is no limit) to get a 0-100 utilisation.
  double cpu_percent = 2;

  // cpu_limit_cores is the container's own CPU limit in cores, 0 when it has
  // none. With no limit the container may use the whole node, which is why the
  // client falls back to node_cpus for the ratio.
  double cpu_limit_cores = 3;

  int64 memory_bytes = 4;

  // memory_limit_bytes is the container's limit if it has one, otherwise the
  // node's total memory — the same substitution docker itself makes.
  // memory_limited says which of the two it is, so "80% of its limit" is never
  // confused with "80% of the node".
  int64 memory_limit_bytes = 5;
  bool memory_limited = 6;

  // health is the container's healthcheck verdict: "healthy", "unhealthy",
  // "starting", or "" when the container declares no healthcheck (and also when
  // the agent could not tell — the two are indistinguishable here, and both
  // mean "do not claim anything about this container's health").
  //
  // It rides along with the usage readings because the manager cannot supply
  // it: a swarm task reads "running" while its container fails every probe, so
  // health is only knowable on the node itself.
  string health = 7;
}

message ListImagesRequest {}

message ListImagesResponse {
  repeated ImageInfo images = 1;

  // Totals for the node, so a client can say what is at stake without summing a
  // long list — and can show the safe and the risky figure separately, because
  // they are what the operator is choosing between.
  int64 total_bytes = 2;
  int64 dangling_bytes = 3;  // untagged leftovers: nothing can start from these
  int64 unused_bytes = 4;    // tagged, but no RUNNING container uses them
}

message ImageInfo {
  string id = 1;
  repeated string tags = 2;  // empty for a dangling image
  int64 size_bytes = 3;
  int64 created_unix = 4;
  // in_use means a container that is RUNNING on this node right now uses it.
  // It is not the same as "needed": a service scaled to zero, or a task between
  // restarts, still needs its image and shows in_use=false.
  bool in_use = 5;
  bool dangling = 6;
}

message PruneImagesRequest {
  // all=false removes only DANGLING images — untagged leftovers of a rebuild,
  // which nothing can be about to start from. Always safe.
  //
  // all=true also removes TAGGED images that no running container uses. On a
  // swarm node that includes the image of any service currently scaled to zero
  // or between restarts: it will have to be pulled again, which is an outage if
  // the registry is unreachable. A client MUST present the two as separate
  // choices and MUST NOT default to this one.
  bool all = 1;
}

message PruneImagesResponse {
  int64 reclaimed_bytes = 1;
  repeated string deleted = 2;  // what the daemon reported removing
}

// PruneCategory is one kind of object a prune can remove. The names in the
// comments are the ones the schedule labels and the cli use
// (internal/prunesched).
enum PruneCategory {
  PRUNE_CATEGORY_UNSPECIFIED = 0;
  // "containers": stopped containers that finished longer ago than
  // containers_until. Authorized as container.prune.
  PRUNE_CATEGORY_CONTAINERS = 1;
  // "images": EVERY image no container uses, tagged or not — the same sweep as
  // PruneImagesRequest.all=true, and authorized the same way, image.prune.all.
  PRUNE_CATEGORY_IMAGES = 2;
  // "dangling-images": untagged images only, authorized as image.prune.
  // Selecting it together with IMAGES adds nothing.
  PRUNE_CATEGORY_DANGLING_IMAGES = 3;
  // "buildcache": all build cache no build is using. Authorized as
  // buildcache.prune.
  PRUNE_CATEGORY_BUILD_CACHE = 4;
  // "networks": LOCAL-scope networks no container references, removed one by
  // one — never the Engine's networks/prune, which on a manager also removes
  // unused swarm overlay networks. Authorized as network.prune.
  PRUNE_CATEGORY_NETWORKS = 5;
  // "volumes": every volume no container references, NAMED ones included
  // (Engine all=true). Data loss; never implied by anything else. Authorized
  // as volume.prune.
  PRUNE_CATEGORY_VOLUMES = 6;
}

message ReclaimStatsRequest {
  // measure_now asks the agent to measure instead of answering from its last
  // background measurement. Rate-limited: inside the limit the agent answers
  // from memory and sets measure_throttled.
  bool measure_now = 1;
}

message ReclaimCategory {
  PruneCategory category = 1;
  int64 count = 2;        // objects a prune of this category would remove
  int64 bytes = 3;        // what it would free; meaningful only if bytes_known
  bool bytes_known = 4;   // false for networks, and whenever the size is unknown
  // held_back counts objects of this kind a prune deliberately KEEPS for now:
  // stopped containers that finished more recently than containers_until.
  int64 held_back = 5;
}

message ReclaimStatsResponse {
  repeated ReclaimCategory categories = 1;
  string measured_at = 2;        // RFC3339; empty until the first measurement
  string measure_error = 3;      // the last measurement failed; figures are older
  bool measure_throttled = 4;    // measure_now was refused by the rate limit
  string containers_until = 5;   // the age filter the containers figure used
  PruneSchedule schedule = 6;
  PruneRun last_run = 7;         // unset until the schedule has run once
}

// PruneSchedule is the schedule as THIS agent read it from its own container
// labels at start. Changing the labels restarts the agents, so it is current.
message PruneSchedule {
  bool enabled = 1;
  string error = 2;                       // the labels did not parse; the schedule is off
  repeated string days = 3;               // "mon".."sun"
  string start = 4;                       // "HH:MM"
  uint32 times_per_day = 5;
  string tz = 6;                          // IANA name; "UTC" by default
  repeated PruneCategory categories = 7;
  string containers_until = 8;            // Go duration
  repeated string label_filters = 9;      // "key" or "key=value"
  string next_run = 10;                   // RFC3339; empty when disabled
}

message PruneRun {
  string started_at = 1;                  // RFC3339
  string finished_at = 2;                 // RFC3339
  repeated PruneCategoryResult results = 3;
  string error = 4;                       // first failure, if any
}

message PruneRequest {
  // categories to prune. The agent runs them in ITS fixed order (containers,
  // images, build cache, networks, volumes) whatever the order here, because
  // removing containers is what leaves the rest unused. Duplicates are
  // ignored. Empty is INVALID_ARGUMENT: there is no implicit "everything".
  repeated PruneCategory categories = 1;
  // containers_until is a Go duration: stopped containers that finished more
  // recently than this are kept, so their logs stay readable. Empty means the
  // agent's default (24h); "0s" removes every stopped container.
  string containers_until = 2;
  // label_filters scopes every category that supports it to objects carrying
  // these labels ("key" or "key=value"; all must match). Build cache has no
  // labels and is SKIPPED when a filter is set.
  repeated string label_filters = 3;
}

message PruneCategoryResult {
  PruneCategory category = 1;
  int64 freed_bytes = 2;
  int64 count = 3;           // objects removed
  string error = 4;          // this category failed or was refused; the others still ran
  bool skipped = 5;          // not attempted (build cache under a label filter)
}

message PruneResponse {
  repeated PruneCategoryResult results = 1;
}

message NetworkEndpointsRequest {
  // network_ids narrows the answer to these networks (ID or name). Empty means
  // every swarm-scope network THIS node has joined. A requested network that
  // is missing or not swarm-scope comes back with its error set, not as a
  // failed RPC.
  repeated string network_ids = 1;
}

message NetworkEndpointsResponse {
  repeated NetworkEndpointsInfo networks = 1;  // sorted by name

  // host_links are the node's OWN network interfaces — the underlay the
  // overlays above ride on — sorted by name. Empty when the agent cannot see
  // them (it needs the host's sysfs mounted read-only; see HostLink).
  //
  // They are here, on a networks call, rather than in an RPC of their own
  // because they answer a question about these networks: an overlay frame has
  // to fit the link that carries it, and Docker sizes overlays for a 1500-byte
  // link whether or not that is what the node has. A 1450-byte underlay with
  // the default overlay silently drops every full-size packet.
  repeated HostLink host_links = 2;
}

// HostLink is one interface of the node itself, read from the host's sysfs.
//
// Only what sysfs offers, which is deliberately little: no addresses, because
// sysfs has none and reading them would mean the host's network namespace or
// its /proc, neither of which the agent has or should get for this. Picking
// which link is "the underlay" is therefore the CLIENT's job, from these
// facts, and it says which one it chose.
message HostLink {
  string name = 1;       // interface name, e.g. "enp7s0"
  uint32 mtu = 2;        // bytes
  string operstate = 3;  // "up", "down", "unknown" — sysfs operstate, verbatim
  // arp_type is sysfs "type": 1 is Ethernet, 772 loopback, and everything else
  // is something more exotic (a tunnel, wireguard). Carried raw so the client
  // can filter without this file deciding what counts.
  uint32 arp_type = 4;
}

// NetworkEndpointsInfo is one network as THIS node's daemon sees it.
message NetworkEndpointsInfo {
  string id = 1;
  string name = 2;
  string driver = 3;  // "overlay" for every swarm network today
  bool ingress = 4;   // the routing-mesh network
  // local_endpoints are the endpoints attached ON THIS NODE: task containers,
  // attachable containers, and the node's load-balancer endpoint. Sorted by
  // name.
  repeated NetworkLocalEndpoint local_endpoints = 5;
  // services is the daemon's networkdb view of the WHOLE network, every
  // node's tasks included. Sorted by name.
  repeated NetworkServiceEndpoints services = 6;
  // peers are the nodes this daemon believes share the network, itself
  // included. Sorted by IP.
  repeated NetworkPeer peers = 7;
  // error is set when this network could not be inspected, or was requested
  // but is missing or not swarm-scope; the fields above (bar id) are then
  // empty, and the other networks are still reported.
  string error = 8;
}

message NetworkLocalEndpoint {
  // container_id is the daemon's key for the endpoint: a container ID, or
  // for the load-balancer endpoint "lb-<network>" ("ingress-sbox" on ingress).
  string container_id = 1;
  string name = 2;
  string endpoint_id = 3;
  string ipv4_address = 4;  // CIDR as the daemon reports it, "10.0.1.5/24"; empty if none
  string ipv6_address = 5;  // CIDR; empty if none
  string mac_address = 6;   // "02:42:0a:00:01:05"; empty if the daemon reported none
  // load_balancer marks the node's load-balancer endpoint: not a task, but it
  // holds an IP and a MAC on the network all the same.
  bool load_balancer = 7;
}

message NetworkServiceEndpoints {
  // name is the service name. The daemon files every node's load-balancer
  // endpoint under the EMPTY name, so "" is a real entry, not a missing one.
  string name = 1;
  string vip = 2;  // the service's virtual IP; empty for dnsrr and for ""
  repeated NetworkTaskEndpoint tasks = 3;  // sorted by name
}

message NetworkTaskEndpoint {
  string name = 1;         // task container name; "<network>-endpoint" for a load balancer
  string endpoint_id = 2;
  string endpoint_ip = 3;  // bare address, no prefix length
  string host_ip = 4;      // the node owning the endpoint (Info["Host IP"]); empty if not reported
}

message NetworkPeer {
  string name = 1;  // the peer node's networkdb name
  string ip = 2;
}

message KillContainerRequest {
  string container_id = 1; // full (or unique prefix) container ID; must be a swarm task
}

message KillContainerResponse {}

message InspectContainerRequest {
  string container_id = 1; // full (or unique prefix) container ID; must be a swarm task
}

message InspectContainerResponse {
  // The Engine's container inspect document, verbatim (JSON). It includes
  // Config.Env, exactly as `docker container inspect` on the node would.
  bytes inspect_json = 1;
}
